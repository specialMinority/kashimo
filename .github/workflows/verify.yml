name: Verify and build Kashimo

on:
  push:
    branches: [master, feature/cat-design-bulk-delete]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
      - uses: actions/upload-artifact@v4
        with:
          name: kashimo-web
          path: dist
          include-hidden-files: true

  android:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"
      NODE_ENV: production
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build installable preview APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,x86_64
      # Expo's generated debug keystore signs this preview. Use the owner's EAS release key for Play.
      - uses: actions/upload-artifact@v4
        with:
          name: kashimo-android-preview
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  android-ui:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - uses: actions/download-artifact@v4
        with:
          name: kashimo-android-preview
          path: android-apk
      - name: Download previous APK for reproduction and upgrade check
        run: curl --fail --location --retry 3 https://github.com/specialMinority/kashimo/releases/download/v1.1.0-preview/kashimo-1.1.0-preview.apk -o android-apk/previous.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compare native tab rendering before and after update
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          ram-size: 3072M
          disk-size: 4096M
          disable-animations: true
          script: python scripts/check-android-tabs.py android-apk/previous.apk android-apk/app-release.apk test-results/android-tabs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kashimo-android-tab-verification
          path: test-results/android-tabs
          if-no-files-found: warn
