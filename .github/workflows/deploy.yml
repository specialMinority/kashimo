name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Export Web
        run: npx expo export -p web

      - name: Fix paths for GitHub Pages
        run: |
          cd dist
          # Replace absolute paths with relative paths in index.html
          sed -i 's|href="/favicon.ico"|href="./favicon.ico"|g' index.html
          sed -i 's|src="/_expo/|src="./_expo/|g' index.html
          # Add .nojekyll to prevent Jekyll processing
          touch .nojekyll
          echo "Fixed paths in index.html"
          cat index.html

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}
